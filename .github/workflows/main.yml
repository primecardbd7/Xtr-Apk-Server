name: Xtr Studio APK Builder
on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Fresh Android App
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          APP="${{ github.event.client_payload.app_name }}"
          PKG=$(echo "$PKG" | tr -d ' ' | tr -d '"' | tr -d "'")
          APP=$(echo "$APP" | tr -d '"' | tr -d "'")
          if [[ "$PKG" != *.* ]]; then
            PKG="com.xtrweb.$PKG"
          fi
          
          cordova create xtrapp "$PKG" "$APP"
          cd xtrapp
          cordova platform add android@13.0.0
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-file-transfer
          cordova plugin add cordova-plugin-statusbar

      - name: Process Data, Images & Fix Dynamic Color 🚨
        env:
          USE_CAMERA: ${{ github.event.client_payload.use_camera }}
          USE_MIC: ${{ github.event.client_payload.use_mic }}
          USE_STORAGE: ${{ github.event.client_payload.use_storage }}
          USE_DYNAMIC: ${{ github.event.client_payload.use_dynamic }}
          USE_SECURITY: ${{ github.event.client_payload.use_security }}
          STATUS_COLOR: ${{ github.event.client_payload.status_bar_color }}
        run: |
          cat << 'EOF' > process_app.py
          import os, json, base64, re

          # 🚨 ম্যাজিক ১: JSON থেকে কোড এবং ছবি পড়া হচ্ছে (কোনো ফাইল হারাবে না)
          try:
              with open('user_data.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              html_data = data.get('code', '<h1>Error loading code!</h1>')
              icon_b64 = data.get('icon', 'null').replace('\n', '').strip()
              splash_b64 = data.get('splash', 'null').replace('\n', '').strip()
          except Exception:
              html_data = '<h1>JSON Data Error!</h1>'
              icon_b64 = 'null'
              splash_b64 = 'null'

          use_cam = str(os.environ.get('USE_CAMERA', 'false')).lower() == 'true'
          use_mic = str(os.environ.get('USE_MIC', 'false')).lower() == 'true'
          use_storage = str(os.environ.get('USE_STORAGE', 'false')).lower() == 'true'
          use_dynamic = str(os.environ.get('USE_DYNAMIC', 'false')).lower() == 'true'
          use_security = str(os.environ.get('USE_SECURITY', 'false')).lower() == 'true'
          status_color = os.environ.get('STATUS_COLOR', '#0D6EFD')

          if 'cordova.js' not in html_data:
              html_data = '<script src=\"cordova.js\"></script>\n' + html_data

          cam_str = 'true' if use_cam else 'false'
          mic_str = 'true' if use_mic else 'false'
          store_str = 'true' if use_storage else 'false'

          # 🚨 ম্যাজিক ২: ডাইনামিক স্ট্যাটাস বার ফিক্স (কালো হবে না)
          if use_dynamic:
              # স্ট্যাটাস বার ট্রান্সপারেন্ট করার পারফেক্ট কোড
              status_script = "StatusBar.overlaysWebView(true); StatusBar.backgroundColorByHexString('#00000000'); StatusBar.styleDefault();"
          else:
              status_script = f"StatusBar.overlaysWebView(false); StatusBar.backgroundColorByHexString('{status_color}'); StatusBar.styleLightContent();"

          permission_script = f"""
          <script>
          document.addEventListener('deviceready', function() {{
              if(StatusBar) {{ {status_script} }}
              var permissions = cordova.plugins.permissions;
              var list = [];
              if ({cam_str}) list.push(permissions.CAMERA);
              if ({mic_str}) list.push(permissions.RECORD_AUDIO);
              if ({store_str}) {{
                  list.push('android.permission.READ_MEDIA_IMAGES');
                  list.push('android.permission.READ_MEDIA_VIDEO');
                  list.push(permissions.WRITE_EXTERNAL_STORAGE);
                  list.push(permissions.READ_EXTERNAL_STORAGE);
              }}
              if (list.length > 0) permissions.requestPermissions(list, function(){{}}, function(){{}});
              setTimeout(function() {{ if(navigator.splashscreen) navigator.splashscreen.hide(); }}, 3000);
          }}, false);
          </script>
          """
          
          if '</body>' in html_data:
              html_data = html_data.replace('</body>', permission_script + '\n</body>')
          else:
              html_data += permission_script

          # সিকিউরিটি
          if use_security:
              encoded_html = base64.b64encode(html_data.encode('utf-8')).decode('utf-8')
              html_data = f"<!DOCTYPE html><html><head><script>document.write(decodeURIComponent(escape(atob('{encoded_html}'))));</script></head><body></body></html>"

          os.makedirs('xtrapp/www', exist_ok=True)
          with open('xtrapp/www/index.html', 'w', encoding='utf-8') as f:
              f.write(html_data)

          # 🚨 ম্যাজিক ৩: ছবিগুলো ডিকোড করে সেভ করা হচ্ছে
          os.makedirs('xtrapp/res', exist_ok=True)
          config = open('xtrapp/config.xml', 'r', encoding='utf-8').read()
          config = config.replace('<widget ', '<widget xmlns:android=\"http://schemas.android.com/apk/res/android\" ')

          if icon_b64 != 'null':
              try:
                  with open('xtrapp/res/icon.png', 'wb') as f:
                      f.write(base64.b64decode(icon_b64 + '==='))
                  config = config.replace('</widget>', '    <icon src=\"res/icon.png\" />\n</widget>')
              except Exception as e: print("Icon Error:", e)

          if splash_b64 != 'null':
              try:
                  with open('xtrapp/res/splash.png', 'wb') as f:
                      f.write(base64.b64decode(splash_b64 + '==='))
                  splash_xml = '''
                  <preference name=\"AndroidWindowSplashScreenAnimatedIcon\" value=\"res/splash.png\" />
                  <preference name=\"AndroidWindowSplashScreenBackground\" value=\"#FFFFFF\" />
                  <preference name=\"SplashScreenDelay\" value=\"3000\" />
                  <preference name=\"ShowSplashScreenSpinner\" value=\"false\" />
                  '''
                  config = config.replace('</widget>', splash_xml + '\n</widget>')
              except Exception as e: print("Splash Error:", e)

          timeout_fix = """
          <preference name="loadUrlTimeoutValue" value="700000" />
          <preference name="KeepRunning" value="true" />
          <preference name="ErrorUrl" value="" />
          """
          config = config.replace('</widget>', timeout_fix + '\n</widget>')

          # 🚨 ম্যাজিক ৪: ডাইনামিক স্ট্যাটাস বারের জন্য Light থিম (যাতে কালো না দেখায়)
          p_xml = '<platform name="android">\n'
          if use_dynamic:
              p_xml += '  <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">\n    <application android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:usesCleartextTraffic="true" />\n  </edit-config>\n'
          else:
              p_xml += '  <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">\n    <application android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true" />\n  </edit-config>\n'
          
          if use_cam:
              p_xml += '  <config-file target="AndroidManifest.xml" parent="/*">\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n  </config-file>\n'
          if use_mic:
              p_xml += '  <config-file target="AndroidManifest.xml" parent="/*">\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n  </config-file>\n'
          if use_storage:
              p_xml += '  <config-file target="AndroidManifest.xml" parent="/*">\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n  </config-file>\n'
          p_xml += '</platform>'

          config = config.replace('</widget>', p_xml + '\n</widget>')
          
          with open('xtrapp/config.xml', 'w', encoding='utf-8') as f:
              f.write(config)
          EOF
          
          python3 process_app.py

      - name: Compile and Build APK
        run: |
          cd xtrapp
          export GRADLE_OPTS="-Xmx2048m -Dorg.gradle.daemon=false"
          echo "org.gradle.jvmargs=-Xmx2048m" >> platforms/android/gradle.properties
          cordova build android --debug

      - name: Release Final APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
        run: |
          SAFE_NAME=$(echo "$APP_NAME" | tr -d ' ' | tr -d '"' | tr -d "'")
          gh release delete $SAFE_NAME --yes || true
          git push --delete origin $SAFE_NAME || true
          gh release create $SAFE_NAME xtrapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk -t "$SAFE_NAME" -n "Latest Build"
