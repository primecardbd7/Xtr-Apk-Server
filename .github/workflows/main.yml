name: Xtr Studio APK Builder
on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Fresh Android App
        run: |
          PKG="${{ github.event.client_payload.package_name }}"
          APP="${{ github.event.client_payload.app_name }}"
          PKG=$(echo "$PKG" | tr -d ' ' | tr -d '"' | tr -d "'")
          APP=$(echo "$APP" | tr -d '"' | tr -d "'")
          if [[ "$PKG" != *.* ]]; then
            PKG="com.xtrweb.$PKG"
          fi
          
          cordova create xtrapp "$PKG" "$APP"
          cd xtrapp
          cordova platform add android@13.0.0
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-file-transfer
          cordova plugin add cordova-plugin-statusbar

      - name: Install Notification & Location Plugins
        env:
          USE_NOTIFICATION: ${{ github.event.client_payload.use_notification }}
        run: |
          USE_LOC=$(python3 -c "import json; d=json.load(open('user_data.json')); print('true' if d.get('use_location') else 'false')" || echo "false")
          cd xtrapp
          if [ "$USE_NOTIFICATION" = "true" ]; then
            cordova plugin add cordova-plugin-local-notification-12
          fi
          if [ "$USE_LOC" = "true" ]; then
            cordova plugin add cordova-plugin-geolocation --variable GPS_REQUIRED="false"
          fi

      - name: Process Code & Inject Safe Magic 🚨
        run: |
          cat << 'EOF' > process_app.py
          import os, json, base64, re, urllib.parse, glob

          def decode_b64_safe(b64_str):
              pad = len(b64_str) % 4
              if pad: b64_str += '=' * (4 - pad)
              return base64.b64decode(b64_str)

          try:
              with open('user_data.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              html_data = data.get('code', '<h1>Error loading code!</h1>')
              icon_b64 = data.get('icon', 'null').replace('\n', '').strip()
              splash_b64 = data.get('splash', 'null').replace('\n', '').strip()
          except Exception:
              data = {}
              html_data = '<h1>JSON Data Error!</h1>'
              icon_b64 = 'null'
              splash_b64 = 'null'

          ver_name = re.sub(r'["\'<>&\s]', '', str(data.get('version_name', '1.0.0'))) or '1.0.0'
          ver_code = re.sub(r'[^0-9]', '', str(data.get('version_code', '1'))) or '1'
          if int(ver_code) < 1:
              ver_code = '1'

          use_cam = bool(data.get('use_camera', False))
          use_mic = bool(data.get('use_mic', False))
          use_storage = bool(data.get('use_storage', False))
          use_loc = bool(data.get('use_location', False))
          use_dynamic = bool(data.get('use_dynamic', False))
          use_security = bool(data.get('use_security', False))
          use_fullscreen = bool(data.get('use_fullscreen', False))
          use_notif = bool(data.get('use_notification', False))
          status_color = str(data.get('status_bar_color', '#0D6EFD'))

          use_block_screenshot = bool(data.get('use_block_screenshot', False))
          screen_orientation = str(data.get('screen_orientation', 'default')).lower()
          use_double_back_exit = bool(data.get('use_double_back_exit', False))
          use_back_nav = bool(data.get('use_back_nav', False))
          use_keep_screen_on = bool(data.get('use_keep_screen_on', False))

          use_offline_page = bool(data.get('use_offline_page', False))
          use_file_download = bool(data.get('use_file_download', False))
          use_bg_audio = bool(data.get('use_bg_audio', False))

          native_css = "<style> * { -webkit-tap-highlight-color: transparent !important; -webkit-user-select: none !important; user-select: none !important; } input, textarea { -webkit-user-select: auto !important; user-select: auto !important; } </style>"

          if '<head>' in html_data.lower():
              html_data = re.sub(r'(<head[^>]*>)', r'\1\n' + native_css, html_data, count=1, flags=re.IGNORECASE)
          else:
              html_data = native_css + html_data

          if 'cordova.js' not in html_data:
              html_data = '<script src=\"cordova.js\"></script>\n' + html_data

          cam_str = 'true' if use_cam else 'false'
          mic_str = 'true' if use_mic else 'false'
          store_str = 'true' if use_storage else 'false'
          loc_str = 'true' if use_loc else 'false'
          notif_str = 'true' if use_notif else 'false'

          if use_dynamic:
              status_script = "StatusBar.overlaysWebView(true); StatusBar.backgroundColorByHexString('#00000000'); StatusBar.styleDefault();"
          else:
              status_script = "StatusBar.overlaysWebView(false); StatusBar.backgroundColorByHexString('" + status_color + "'); StatusBar.styleLightContent();"

          # 🚨 হার্ডওয়্যার ব্যাক বাটন নেভিগেশন ও ডাবল ট্যাপ এক্সিট স্মার্ট কম্বো
          back_script = ""
          if use_back_nav and use_double_back_exit:
              back_script = """
              var _lastBackPress = 0;
              var _wentBack = false;
              var _backChecking = false;
              function _markWentBack() { _wentBack = true; }
              window.addEventListener('popstate', _markWentBack);
              window.addEventListener('hashchange', _markWentBack);
              window.addEventListener('pagehide', _markWentBack);
              window.addEventListener('beforeunload', _markWentBack);
              function _showExitToast() {
                  var now = new Date().getTime();
                  if (now - _lastBackPress < 2000) {
                      navigator.app.exitApp();
                  } else {
                      _lastBackPress = now;
                      var t = document.createElement("div");
                      t.innerText = "Press back again to exit";
                      t.style.cssText = "position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:rgba(20,20,30,0.9);color:#fff;padding:10px 22px;border-radius:25px;font-size:14px;font-weight:bold;z-index:2147483647;font-family:sans-serif;box-shadow:0 4px 15px rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);pointer-events:none;";
                      document.body.appendChild(t);
                      setTimeout(function(){ if(t) t.remove(); }, 2000);
                  }
              }
              document.addEventListener('backbutton', function(e) {
                  if (_backChecking) return;
                  _backChecking = true;
                  _wentBack = false;
                  window.history.back();
                  setTimeout(function() {
                      _backChecking = false;
                      if (!_wentBack) {
                          _showExitToast();
                      }
                  }, 120);
              }, false);
              """
          elif use_back_nav:
              back_script = """
              var _wentBack = false;
              var _backChecking = false;
              function _markWentBack() { _wentBack = true; }
              window.addEventListener('popstate', _markWentBack);
              window.addEventListener('hashchange', _markWentBack);
              window.addEventListener('pagehide', _markWentBack);
              window.addEventListener('beforeunload', _markWentBack);
              document.addEventListener('backbutton', function(e) {
                  if (_backChecking) return;
                  _backChecking = true;
                  _wentBack = false;
                  window.history.back();
                  setTimeout(function() {
                      _backChecking = false;
                      if (!_wentBack) {
                          navigator.app.exitApp();
                      }
                  }, 120);
              }, false);
              """
          elif use_double_back_exit:
              back_script = """
              var _lastBackPress = 0;
              document.addEventListener('backbutton', function(e) {
                  var now = new Date().getTime();
                  if (now - _lastBackPress < 2000) {
                      navigator.app.exitApp();
                  } else {
                      _lastBackPress = now;
                      var t = document.createElement("div");
                      t.innerText = "Press back again to exit";
                      t.style.cssText = "position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:rgba(20,20,30,0.9);color:#fff;padding:10px 22px;border-radius:25px;font-size:14px;font-weight:bold;z-index:2147483647;font-family:sans-serif;box-shadow:0 4px 15px rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);pointer-events:none;";
                      document.body.appendChild(t);
                      setTimeout(function(){ if(t) t.remove(); }, 2000);
                  }
              }, false);
              """

          # ফাইল ও PDF সরাসরি ডাউনলোড ইন্টারসেপ্টর
          download_script = ""
          if use_file_download:
              download_script = """
              document.addEventListener('click', function(e) {
                  var a = e.target.closest('a');
                  if (a && a.href) {
                      var u = a.href.toLowerCase();
                      var exts = ['.pdf', '.zip', '.rar', '.apk', '.mp3', '.mp4', '.doc', '.docx', '.xls', '.xlsx', '.csv', '.txt'];
                      var isDl = a.hasAttribute('download');
                      for (var i = 0; i < exts.length; i++) {
                          if (u.indexOf(exts[i]) !== -1) { isDl = true; break; }
                      }
                      if (isDl) {
                          e.preventDefault();
                          window.open(a.href, '_system');
                      }
                  }
              }, true);
              """

          # অফলাইন স্ক্রিন চেকার
          offline_script = ""
          offline_dom = ""
          if use_offline_page:
              offline_dom = """
              <div id="xtr-offline-screen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0A122A;color:#fff;z-index:2147483646;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;padding:24px;text-align:center;">
                  <div style="font-size:52px;margin-bottom:16px;">📡</div>
                  <h2 style="font-size:22px;font-weight:bold;margin-bottom:8px;color:#fff;">No Internet Connection</h2>
                  <p style="color:#8E9BB5;font-size:14px;margin-bottom:24px;line-height:1.4;">Please check your connection and tap retry.</p>
                  <button onclick="window.location.reload()" style="background:#0D6EFD;color:#fff;border:none;padding:12px 34px;border-radius:25px;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 4px 15px rgba(13,110,253,0.4);">RETRY</button>
              </div>
              """
              offline_script = """
              function _checkNet() {
                  var s = document.getElementById('xtr-offline-screen');
                  if (!s) return;
                  if (!navigator.onLine) { s.style.display = 'flex'; }
                  else { s.style.display = 'none'; }
              }
              window.addEventListener('online', _checkNet);
              window.addEventListener('offline', _checkNet);
              document.addEventListener('deviceready', _checkNet, false);
              setInterval(_checkNet, 3000);
              """

          permission_script = """<script>document.addEventListener('deviceready', function() { if(window.StatusBar) { """ + status_script + """ } var permissions = cordova.plugins.permissions; var list = []; if (""" + cam_str + """) list.push(permissions.CAMERA); if (""" + mic_str + """) list.push(permissions.RECORD_AUDIO); if (""" + store_str + """) { list.push('android.permission.READ_MEDIA_IMAGES'); list.push('android.permission.READ_MEDIA_VIDEO'); list.push(permissions.WRITE_EXTERNAL_STORAGE); list.push(permissions.READ_EXTERNAL_STORAGE); } if (""" + loc_str + """) { list.push(permissions.ACCESS_FINE_LOCATION); list.push(permissions.ACCESS_COARSE_LOCATION); } if (""" + notif_str + """) list.push('android.permission.POST_NOTIFICATIONS'); if (list.length > 0) permissions.requestPermissions(list, function(){}, function(){}); if (""" + notif_str + """) { setTimeout(function() { if (window.cordova && cordova.plugins && cordova.plugins.notification) { cordova.plugins.notification.local.requestPermission(function(granted) {}); } }, 1000); } """ + back_script + download_script + offline_script + """ }, false);</script>"""
          
          if '</body>' in html_data:
              html_data = html_data.replace('</body>', offline_dom + permission_script + '\n</body>')
          else:
              html_data += offline_dom + permission_script

          if use_security:
              encoded_url = urllib.parse.quote(html_data)
              secret_key = "XTR_ULTIMATE_MILITARY_SHIELD_2026_KEY"
              xored_bytes = bytearray()
              for i, c in enumerate(encoded_url):
                  xored_bytes.append(ord(c) ^ ord(secret_key[i % len(secret_key)]))
              b64_payload = base64.b64encode(xored_bytes).decode('utf-8')

              core_js = """(function(){ setInterval(function(){ Function("debugger")(); }, 50); var p = "B64_PAYLOAD_HERE"; var k = "SECRET_KEY_HERE"; function checkEnv() { var h = window.location.href || ''; var pr = window.location.protocol || ''; var hn = window.location.hostname || ''; var bad = ['/storage/emulated/', '/sdcard/', 'content://', '/data/user/']; for(var i=0; i<bad.length; i++) { if(h.indexOf(bad[i]) !== -1) return false; } if ((pr === 'https:' || pr === 'http:') && hn === 'localhost') return true; if (h.indexOf('file:///android_asset/') === 0) return true; return false; } function dec(d, key) { var s = atob(d); var r = ''; for(var i=0; i<s.length; i++) { r += String.fromCharCode(s.charCodeAt(i) ^ key.charCodeAt(i % key.length)); } return decodeURIComponent(r); } if (!checkEnv()) { document.getElementById('xtr-security-screen').style.display = 'flex'; } else { try { var cleanHtml = dec(p, k); document.open(); document.write(cleanHtml); document.close(); } catch(e) { document.getElementById('xtr-security-screen').style.display = 'flex'; } } })();""".replace("B64_PAYLOAD_HERE", b64_payload).replace("SECRET_KEY_HERE", secret_key)

              js_array = ','.join(str(ord(c)) for c in core_js)
              bootstrapper = "<script>var _0x9a4b = [" + js_array + "];var _0x1c2d = '';for(var _0x=0; _0x<_0x9a4b.length; _0x++){_0x1c2d+=String.fromCharCode(_0x9a4b[_0x]);}Function(_0x1c2d)();</script>"

              html_data = """<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Protected by XTR Security</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:monospace;}body,html{width:100%;height:100%;background:#000;color:#FFF;overflow:hidden;}#xtr-security-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at center, #1A050A 0%, #000 90%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;z-index:2147483647;text-align:center;}.xtr-title{color:#FF003C;font-size:32px;font-weight:bold;margin-bottom:10px;text-shadow:0 0 20px #FF003C;}.xtr-badge{background:rgba(255,0,60,0.2);border:1px solid #FF003C;padding:5px 15px;border-radius:5px;margin-bottom:20px;}</style></head><body><div id="xtr-security-screen" style="display:none;"><h1 class="xtr-title">XTR SECURITY</h1><div class="xtr-badge">[ ILLEGAL ACCESS BLOCKED ]</div></div>""" + bootstrapper + """</body></html>"""

          os.makedirs('xtrapp/www', exist_ok=True)
          with open('xtrapp/www/index.html', 'w', encoding='utf-8') as f:
              f.write(html_data)

          os.makedirs('xtrapp/res', exist_ok=True)
          config_path = 'xtrapp/config.xml'
          with open(config_path, 'r', encoding='utf-8') as f:
              config = f.read()

          config = config.replace('<widget ', '<widget xmlns:android="http://schemas.android.com/apk/res/android" ')

          # 🚨 App Version Name ও Android Version Code সেট করা হচ্ছে
          config = re.sub(r'(<widget\b[^>]*?\bversion=")[^"]*(")', rf'\g<1>{ver_name}\g<2>', config, count=1)
          if 'android-versionCode=' in config:
              config = re.sub(r'(<widget\b[^>]*?\bandroid-versionCode=")[^"]*(")', rf'\g<1>{ver_code}\g<2>', config, count=1)
          else:
              config = config.replace('<widget ', f'<widget android-versionCode="{ver_code}" ', 1)

          if icon_b64 != 'null':
              try:
                  with open('xtrapp/res/icon.png', 'wb') as f:
                      f.write(decode_b64_safe(icon_b64))
                  config = config.replace('</widget>', '    <icon src="res/icon.png" />\n</widget>')
              except Exception: pass

          if splash_b64 != 'null':
              try:
                  with open('xtrapp/res/splash.png', 'wb') as f:
                      f.write(decode_b64_safe(splash_b64))
                  splash_xml = '    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="res/splash.png" />\n    <preference name="AndroidWindowSplashScreenBackground" value="#121212" />\n    <preference name="SplashScreenDelay" value="3000" />\n'
                  config = config.replace('</widget>', splash_xml + '</widget>')
              except Exception: pass

          if use_fullscreen:
              config = config.replace('</widget>', '    <preference name="Fullscreen" value="true" />\n</widget>')

          if screen_orientation in ['portrait', 'landscape']:
              config = config.replace('</widget>', f'    <preference name="Orientation" value="{screen_orientation}" />\n</widget>')

          if use_bg_audio:
              config = config.replace('</widget>', '    <preference name="KeepRunning" value="true" />\n    <preference name="MediaPlaybackRequiresUserAction" value="false" />\n</widget>')

          if use_file_download:
              config = config.replace('</widget>', '    <allow-intent href="*" />\n</widget>')

          p_xml = '<platform name="android">\n'
          theme = "@style/Theme.AppCompat.NoActionBar" if use_fullscreen else "@style/Theme.AppCompat.Light.NoActionBar"
          p_xml += f'  <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application"><application android:theme="{theme}" android:usesCleartextTraffic="true" /></edit-config>\n'
          p_xml += '</platform>'

          config = config.replace('</widget>', p_xml + '\n</widget>')
          with open(config_path, 'w', encoding='utf-8') as f:
              f.write(config)

          main_activities = glob.glob('xtrapp/platforms/android/app/src/main/java/**/MainActivity.java', recursive=True)
          if main_activities:
              act_file = main_activities[0]
              with open(act_file, 'r', encoding='utf-8') as f:
                  java_content = f.read()

              native_flags = ""
              if use_block_screenshot:
                  native_flags += "        getWindow().setFlags(android.view.WindowManager.LayoutParams.FLAG_SECURE, android.view.WindowManager.LayoutParams.FLAG_SECURE);\n"
              if use_keep_screen_on:
                  native_flags += "        getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n"

              if native_flags:
                  if 'super.onCreate(savedInstanceState);' in java_content:
                      java_content = java_content.replace('super.onCreate(savedInstanceState);', 'super.onCreate(savedInstanceState);\n' + native_flags)
                      with open(act_file, 'w', encoding='utf-8') as f:
                          f.write(java_content)
          EOF
          
          python3 process_app.py

      - name: Build APK without Daemon (Zero Hang Fix) 🚨
        run: |
          cd xtrapp
          mkdir -p platforms/android
          echo "org.gradle.daemon=false" >> platforms/android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> platforms/android/gradle.properties
          cordova build android --debug

      - name: Release Final APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
        run: |
          SAFE_NAME=$(echo "$APP_NAME" | tr -d ' ' | tr -d '"' | tr -d "'")
          gh release delete "$SAFE_NAME" --yes || true
          git push --delete origin "$SAFE_NAME" || true
          gh release create "$SAFE_NAME" xtrapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk -t "$SAFE_NAME" -n "Latest Build"
